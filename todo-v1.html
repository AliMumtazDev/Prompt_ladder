<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f3f7ff;
        --card: #ffffff;
        --text: #162033;
        --muted: #6b7280;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --border: #e5e7eb;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
        padding: 24px;
      }

      .app {
        width: min(100%, 560px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
      }

      form {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      input[type="text"] {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        outline: none;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.16);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 15px;
        font-size: 1rem;
        cursor: pointer;
      }

      .add-btn {
        background: var(--accent);
        color: white;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        background: #fcfdff;
      }

      .item-content {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
      }

      .checkbox {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .todo-text {
        word-break: break-word;
      }

      .todo-text.done {
        text-decoration: line-through;
        color: var(--muted);
      }

      .delete-btn {
        padding: 8px 10px;
        background: #fff1f2;
        color: var(--danger);
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 24px 10px;
        border: 1px dashed var(--border);
        border-radius: 16px;
      }

      .stats {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Todo List</h1>
      <p class="subtitle">Stay on top of your tasks.</p>

      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task" maxlength="120" required />
        <button class="add-btn" type="submit">Add</button>
      </form>

      <ul id="todo-list" class="list"></ul>
      <div class="stats" id="stats">0 tasks</div>
    </main>

    <script>
      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const list = document.getElementById('todo-list');
      const stats = document.getElementById('stats');

      let todos = JSON.parse(localStorage.getItem('todos')) || [];

      function saveTodos() {
        localStorage.setItem('todos', JSON.stringify(todos));
      }

      function renderTodos() {
        if (todos.length === 0) {
          list.innerHTML = '<li class="empty">No tasks yet. Add your first one.</li>';
          stats.textContent = '0 tasks';
          return;
        }

        const completed = todos.filter((todo) => todo.done).length;
        stats.textContent = `${completed}/${todos.length} completed`;

        list.innerHTML = todos
          .map(
            (todo) => `
              <li class="item">
                <label class="item-content">
                  <input class="checkbox" type="checkbox" ${todo.done ? 'checked' : ''} data-id="${todo.id}" />
                  <span class="todo-text ${todo.done ? 'done' : ''}">${todo.text}</span>
                </label>
                <button class="delete-btn" data-id="${todo.id}" type="button">Delete</button>
              </li>
            `
          )
          .join('');
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        todos.unshift({ id: Date.now(), text, done: false });
        input.value = '';
        saveTodos();
        renderTodos();
      });

      list.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('.delete-btn');
        if (deleteButton) {
          const id = Number(deleteButton.dataset.id);
          todos = todos.filter((todo) => todo.id !== id);
          saveTodos();
          renderTodos();
          return;
        }
      });

      list.addEventListener('change', (event) => {
        const checkbox = event.target.closest('.checkbox');
        if (!checkbox) return;

        const id = Number(checkbox.dataset.id);
        todos = todos.map((todo) => (todo.id === id ? { ...todo, done: !todo.done } : todo));
        saveTodos();
        renderTodos();
      });

      renderTodos();
    </script>
  </body>
</html>
