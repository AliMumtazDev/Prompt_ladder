<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Card</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --card: rgba(15, 23, 42, 0.92);
        --border: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-2: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #020617, #111827 50%, #172554);
        color: var(--text);
      }

      .card {
        width: min(100%, 430px);
        padding: 24px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: 0 20px 45px rgba(2, 8, 23, 0.35);
        backdrop-filter: blur(16px);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-2);
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 700;
        background: rgba(34, 197, 94, 0.16);
        color: var(--accent);
        white-space: nowrap;
      }

      .value-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .value {
        font-size: 2rem;
        font-weight: 700;
      }

      .subtext {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .progress-wrap {
        margin: 10px 0 20px;
      }

      .progress-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .bar {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        width: 82%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .mini-stat {
        padding: 12px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .mini-stat .label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .mini-stat strong {
        font-size: 1.05rem;
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px;
        }

        .value-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <article class="card" aria-label="Revenue dashboard card">
      <header class="card-header">
        <div>
          <p class="eyebrow">Performance</p>
          <h1>Revenue Overview</h1>
        </div>
        <span class="pill">▲ 12.4%</span>
      </header>

      <div class="value-row">
        <div class="value">$24,580</div>
        <div class="subtext">vs. last month</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-labels">
          <span>Goal progress</span>
          <span>82%</span>
        </div>
        <div class="bar" aria-hidden="true">
          <span></span>
        </div>
      </div>

      <div class="stats">
        <div class="mini-stat">
          <span class="label">Orders</span>
          <strong>132</strong>
        </div>
        <div class="mini-stat">
          <span class="label">Retention</span>
          <strong>92%</strong>
        </div>
      </div>
    </article>
  </body>
</html>
