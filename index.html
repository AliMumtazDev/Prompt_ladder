<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Card</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6fb;
        --card: linear-gradient(145deg, #ffffff 0%, #f8fbff 100%);
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-2: #14b8a6;
        --shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        --surface: rgba(248, 250, 252, 0.9);
        --surface-strong: #ffffff;
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --bg: #07111f;
        --card: linear-gradient(145deg, #0f172a 0%, #111827 100%);
        --border: rgba(148, 163, 184, 0.24);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-2: #2dd4bf;
        --shadow: 0 22px 50px rgba(2, 8, 23, 0.45);
        --surface: rgba(15, 23, 42, 0.8);
        --surface-strong: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #f8fafc 100%);
        color: var(--text);
        transition: background 220ms ease, color 220ms ease;
      }

      body[data-theme="dark"] {
        background: linear-gradient(135deg, #020617 0%, #111827 50%, #172554 100%);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .card {
        width: min(100%, 460px);
        padding: 24px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: var(--shadow);
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        position: relative;
        overflow: hidden;
        will-change: transform;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(37, 99, 235, 0.08), transparent 40%, rgba(20, 184, 166, 0.08));
        pointer-events: none;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.16);
        border-color: rgba(37, 99, 235, 0.24);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 18px;
        position: relative;
        z-index: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .theme-toggle:hover,
      .theme-toggle:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
        border-color: rgba(37, 99, 235, 0.25);
        outline: none;
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 1.24rem;
        line-height: 1.2;
        font-weight: 700;
        color: var(--text);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 700;
        background: rgba(37, 99, 235, 0.1);
        color: #1d4ed8;
        white-space: nowrap;
      }

      body[data-theme="dark"] .pill {
        background: rgba(96, 165, 250, 0.16);
        color: #bfdbfe;
      }

      .value-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
        position: relative;
        z-index: 1;
      }

      .value {
        font-size: clamp(1.8rem, 3vw, 2.35rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text);
        opacity: 0;
        transform: translateY(8px);
      }

      .value.is-visible {
        animation: fadeUp 550ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      .subtext {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 500;
      }

      .progress-wrap {
        margin: 10px 0 20px;
        padding: 14px;
        border-radius: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        position: relative;
        z-index: 1;
      }

      .progress-labels {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
      }

      .bar {
        width: 100%;
        height: 12px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.24);
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      .bar-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
        box-shadow: 0 0 14px rgba(37, 99, 235, 0.24);
      }

      .bar-fill.is-visible {
        animation: fillBar 800ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        position: relative;
        z-index: 1;
      }

      .mini-stat {
        padding: 13px 14px;
        border-radius: 14px;
        background: linear-gradient(145deg, var(--surface-strong), var(--surface));
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        text-align: left;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        position: relative;
      }

      .mini-stat::after {
        content: "";
        position: absolute;
        inset: auto 14px 10px 14px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), transparent);
        opacity: 0;
        transform: scaleX(0.7);
        transform-origin: left;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .mini-stat:hover::after,
      .mini-stat:focus-visible::after {
        opacity: 1;
        transform: scaleX(1);
      }

      .mini-stat:hover,
      .mini-stat:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
        border-color: rgba(37, 99, 235, 0.24);
        outline: none;
      }

      .mini-stat .label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.01em;
      }

      .mini-stat strong {
        font-size: 1.04rem;
        font-weight: 700;
        color: var(--text);
        opacity: 0;
        transform: translateY(6px);
      }

      .mini-stat strong.is-visible {
        animation: fadeUp 500ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      @media (max-width: 560px) {
        body {
          padding: 14px;
        }

        .card {
          padding: 18px;
          border-radius: 20px;
        }

        .card-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .header-actions {
          width: 100%;
          justify-content: space-between;
        }

        .value-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }

        .progress-wrap {
          padding: 12px;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fillBar {
        from {
          width: 0;
        }
        to {
          width: 82%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .theme-toggle,
        .mini-stat,
        .value,
        .mini-stat strong,
        .bar-fill {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="sr-only" aria-label="Dashboard card content"></main>
    <article class="card" aria-labelledby="card-title" aria-describedby="card-summary">
      <header class="card-header">
        <div>
          <p class="eyebrow">Performance</p>
          <h1 id="card-title">Revenue Overview</h1>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
            <span aria-hidden="true">🌙</span>
            <span>Dark mode</span>
          </button>
          <span class="pill" aria-label="Growth rate 12.4 percent">▲ 12.4%</span>
        </div>
      </header>

      <div class="value-row">
        <div class="value" data-target="24580" data-prefix="$" aria-label="Revenue 24,580 dollars">$0</div>
        <div class="subtext" id="card-summary">vs. last month</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-labels">
          <span>Goal progress</span>
          <span class="progress-percent" aria-label="82 percent complete">82%</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="82 percent complete" aria-label="Goal progress">
          <span class="bar-fill"></span>
        </div>
      </div>

      <div class="stats" aria-label="Key performance metrics">
        <button class="mini-stat" type="button" data-target="132" aria-label="Orders 132">
          <span class="label">Orders</span>
          <strong class="stat-number">0</strong>
        </button>
        <button class="mini-stat" type="button" data-target="92" data-suffix="%" aria-label="Retention 92 percent">
          <span class="label">Retention</span>
          <strong class="stat-number">0</strong>
        </button>
      </div>
    </article>

    <script>
      const toggleButton = document.getElementById('themeToggle');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem('dashboard-theme');
      const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');

      function applyTheme(theme) {
        document.body.dataset.theme = theme;
        toggleButton.setAttribute('aria-pressed', String(theme === 'dark'));
        toggleButton.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        toggleButton.querySelector('span:last-of-type').textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
        toggleButton.querySelector('span[aria-hidden="true"]').textContent = theme === 'dark' ? '☀️' : '🌙';
      }

      function animateValue(element, target, prefix = '', suffix = '') {
        const duration = 900;
        const startTime = performance.now();

        function tick(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(target * eased);
          element.textContent = `${prefix}${current.toLocaleString()}${suffix}`;
          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            element.textContent = `${prefix}${target.toLocaleString()}${suffix}`;
          }
        }

        requestAnimationFrame(tick);
      }

      function animateOnLoad() {
        document.querySelector('.value').classList.add('is-visible');
        document.querySelector('.bar-fill').classList.add('is-visible');
        document.querySelectorAll('.stat-number').forEach((element) => element.classList.add('is-visible'));

        const revenue = document.querySelector('.value');
        const progressBar = document.querySelector('.bar');
        const progressText = document.querySelector('.progress-percent');
        const metrics = document.querySelectorAll('.mini-stat');

        animateValue(revenue, Number(revenue.dataset.target), revenue.dataset.prefix || '', revenue.dataset.suffix || '');

        setTimeout(() => {
          progressBar.setAttribute('aria-valuenow', '82');
          progressText.textContent = '82%';
        }, 300);

        metrics.forEach((metric, index) => {
          const number = metric.querySelector('.stat-number');
          const target = Number(metric.dataset.target);
          const suffix = metric.dataset.suffix || '';
          setTimeout(() => animateValue(number, target, '', suffix), 120 * (index + 1));
        });
      }

      applyTheme(initialTheme);
      toggleButton.addEventListener('click', () => {
        const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('dashboard-theme', nextTheme);
        applyTheme(nextTheme);
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
        if (!localStorage.getItem('dashboard-theme')) {
          applyTheme(event.matches ? 'dark' : 'light');
        }
      });

      window.addEventListener('load', animateOnLoad);
    </script>
  </body>
</html>
