<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Todo App</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --border: #e5e7eb;
        --danger: #ef4444;
        --done: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .app {
        width: min(100%, 640px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      .header {
        margin-bottom: 20px;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 3vw, 2.1rem);
      }

      .header p {
        margin: 0;
        color: var(--muted);
      }

      form {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      input[type="text"] {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 13px 14px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
      }

      button {
        border: none;
        cursor: pointer;
        font-size: 1rem;
        border-radius: 14px;
      }

      .add-btn {
        padding: 12px 16px;
        background: var(--accent);
        color: white;
        font-weight: 600;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fcfdff;
      }

      .item-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
      }

      .checkbox {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
        cursor: pointer;
        flex-shrink: 0;
      }

      .todo-text {
        word-break: break-word;
        line-height: 1.4;
      }

      .todo-text.done {
        text-decoration: line-through;
        color: var(--muted);
      }

      .delete-btn {
        padding: 8px 10px;
        background: #fff1f2;
        color: var(--danger);
        flex-shrink: 0;
      }

      .empty {
        text-align: center;
        padding: 24px 12px;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 16px;
      }

      .footer {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 560px) {
        .app {
          padding: 20px;
        }

        form {
          flex-direction: column;
        }

        .add-btn {
          width: 100%;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Todo List</h1>
        <p>Plan your day with a calm, focused workspace.</p>
      </header>

      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task" maxlength="120" required />
        <button class="add-btn" type="submit">Add Task</button>
      </form>

      <ul id="todo-list" class="list"></ul>
      <div class="footer">
        <span id="stats">0/0 completed</span>
      </div>
    </main>

    <script>
      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const list = document.getElementById('todo-list');
      const stats = document.getElementById('stats');
      const STORAGE_KEY = 'modern-todo-items';

      let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      function saveTodos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderTodos() {
        if (todos.length === 0) {
          list.innerHTML = '<li class="empty">No tasks yet. Add your first one.</li>';
          stats.textContent = '0/0 completed';
          return;
        }

        const completedCount = todos.filter((todo) => todo.done).length;
        stats.textContent = `${completedCount}/${todos.length} completed`;

        list.innerHTML = todos
          .map(
            (todo) => `
              <li class="item">
                <label class="item-left">
                  <input class="checkbox" type="checkbox" ${todo.done ? 'checked' : ''} data-id="${todo.id}" />
                  <span class="todo-text ${todo.done ? 'done' : ''}">${escapeHtml(todo.text)}</span>
                </label>
                <button class="delete-btn" data-id="${todo.id}" type="button">Delete</button>
              </li>
            `
          )
          .join('');
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();

        if (!text) {
          input.focus();
          return;
        }

        todos.unshift({
          id: Date.now() + Math.random(),
          text,
          done: false
        });

        input.value = '';
        saveTodos();
        renderTodos();
        input.focus();
      });

      list.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('.delete-btn');
        if (!deleteButton) return;

        const id = Number(deleteButton.dataset.id);
        todos = todos.filter((todo) => todo.id !== id);
        saveTodos();
        renderTodos();
      });

      list.addEventListener('change', (event) => {
        const checkbox = event.target.closest('.checkbox');
        if (!checkbox) return;

        const id = Number(checkbox.dataset.id);
        todos = todos.map((todo) =>
          todo.id === id ? { ...todo, done: !todo.done } : todo
        );

        saveTodos();
        renderTodos();
      });

      renderTodos();
    </script>
  </body>
</html>
